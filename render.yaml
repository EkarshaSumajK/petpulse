services:
  - type: web
    name: petpulse-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        value: "1186710814528940"
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_AGENT_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_REASONING_MODEL
        value: gpt-5.4
      - key: OPENAI_AUDIO_MODEL
        value: gpt-audio
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CALENDAR_BRIDGE_URL
        value: https://abhilash20.app.n8n.cloud/webhook/petpulse-calendar-bridge
      - key: CALENDAR_BRIDGE_SECRET
        sync: false
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: LOG_LEVEL
        value: INFO
